        type: integer
        fields:
          sort:
            type: integer
      dataset_minimum_age_at_baseline:
        type: integer
        fields:
          sort:
            type: integer
      dataset_storage_distribution:
        type: keyword
        fields:
          sort:
            type: keyword
            normalizer: lowercase
          search:
            type: text
            analyzer: ngram_analyzer
            search_analyzer: keyword_analyzer
      dataset_title:
        type: keyword
        fields:
          search:
            type: text
            analyzer: ngram_analyzer
            search_analyzer: keyword_analyzer
      dataset_title_sort:
        type: keyword
      dataset_uuid:
        type: keyword
        fields:
          sort:
            type: keyword
            normalizer: lowercase
      dataset_source_repo:
        type: keyword
        fields:
          sort:
            type: keyword
            normalizer: lowercase
          search:
            type: text
            analyzer: ngram_analyzer
            search_analyzer: keyword_analyzer
      dataset_year_enrollment_ended:
        type: integer
        fields:
          sort:
            type: integer
      dataset_year_enrollment_started:
        type: integer
        fields:
          sort:
            type: integer
      description:
        type: keyword
        fields:
          sort:
            type: keyword
